project_id = "kundali-konnect"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "kundalikonnect://"
# kundalikonnect://auth/callback is where social sign-in returns (services/auth); add the
# same URLs under Authentication → URL Configuration on the hosted project.
additional_redirect_urls = ["exp://127.0.0.1:8081", "exp://127.0.0.1:8081/--/auth/callback", "kundalikonnect://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Social providers (local `supabase start`). On the hosted project enable them under
# Authentication → Providers instead. Credentials come from the root .env.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# Accept ID tokens from the native Google Sign-In SDK (services/auth/google-native-adapter.ts).
skip_nonce_check = true

[auth.external.facebook]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_FACEBOOK_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_FACEBOOK_SECRET)"

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[auth.sms]
enable_signup = true
template = "Your Kundali Konnect code is {{ .Code }}"

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.send-push-notification]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false

[functions.send-astro-insights]
verify_jwt = false

[functions.cleanup-profile-photos]
verify_jwt = false
